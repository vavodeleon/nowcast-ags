name: nowcast

# Cada 15 minutos. GitHub a veces retrasa los cron unos minutos cuando hay
# carga; para nowcasting eso es tolerable.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:        # boton para correrlo a mano

permissions:
  contents: write           # necesario para guardar el historial aprendido

concurrency:
  group: nowcast
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ejecutar nowcast
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m nowcast.run

      - name: Guardar historial y publicar
        run: |
          git config user.name  "nowcast-bot"
          git config user.email "nowcast-bot@users.noreply.github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "sin cambios"
          else
            git commit -m "nowcast $(date -u '+%Y-%m-%d %H:%M UTC')"
            # otra corrida pudo haber hecho push mientras tanto
            for i in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep 5
            done
          fi
