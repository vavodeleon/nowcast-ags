name: nowcast

# Una pasada por disparo. Nada de bucles con sleep.
#
# Historia, para que no se repita: se intentó mantener el runner ocupado
# horas con `sleep` entre pasadas, para compensar que el cron de GitHub no
# se cumple. Funcionaba, pero es justo lo que los términos de servicio de
# Actions prohíben —"serverless computing" y "actividad no relacionada con
# la producción, prueba, despliegue o publicación del proyecto"— y GitHub
# lo hizo cumplir: canceló corridas a mitad y dejó otras encoladas sin
# asignar máquina.
#
# Así que aquí se hace lo correcto: un disparo, una pasada, ~1 minuto de
# runner. La cadencia queda a merced del cron de GitHub (en la práctica una
# corrida cada 1-3 horas). Si hace falta cadencia real de 15 minutos, eso
# vive en un servidor propio ejecutando el mismo código; ver el README.
# El cron quedo apagado a proposito: el Raspberry Pi publica cada 15 minutos
# con un temporizador de systemd, que si cumple horarios. Dos autores
# escribiendo en el mismo repositorio cada cuarto de hora solo genera
# conflictos de rebase. Se conserva el disparo manual como red de seguridad
# por si algun dia el Pi se cae.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # para leer y cerrar tus correcciones

concurrency:
  group: nowcast
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ejecutar nowcast
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOPIC_SALUD: ${{ secrets.NTFY_TOPIC_SALUD }}
          # Necesario para leer y cerrar tus correcciones. En Actions este
          # token NO se expone solo: hay que declararlo. Sin el, la API se
          # consulta sin autenticar y los runners -que comparten IP- chocan
          # contra el limite de 60 peticiones por hora.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m nowcast.run

      - name: Guardar historial y publicar
        run: |
          git config user.name  "nowcast-bot"
          git config user.email "nowcast-bot@users.noreply.github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "sin cambios"
          else
            git commit -m "nowcast $(date -u '+%Y-%m-%d %H:%M UTC')"
            for intento in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
                && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep 5
            done
          fi
