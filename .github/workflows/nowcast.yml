name: nowcast

# Un disparo por hora, pero cada corrida dura DOS horas. Se solapan a
# propósito.
#
# Historia de por qué: el diseño obvio, `cron: "*/15"`, no funciona — GitHub
# retrasa o se salta los workflows programados. Medido aquí: de 4 corridas
# esperadas en una hora, ocurrió 1; y el cron diario del reporte matutino no
# disparó ni una vez en su primer día.
#
# La solución tiene dos partes:
#
# 1. Se pide un disparo por hora y las pasadas de 15 min se hacen dentro del
#    job, durmiendo entre ellas. Un solo cron a cumplir en vez de cuatro.
#
# 2. Cada job hace 16 pasadas (~4 h), no 4. En operación normal el disparo de
#    la hora siguiente cancela al anterior enseguida y no se nota nada. Pero
#    si GitHub se salta disparos, el job viejo SIGUE CORRIENDO y cubre el
#    hueco él solo.
#
#    Las 4 horas no son arbitrarias: midiendo los disparos reales de este
#    repo salieron a las 23:52, 2:48 y 5:26 — es decir, GitHub cumple
#    aproximadamente uno de cada tres, con huecos de hasta 3 horas. Cubrir 4
#    deja margen sobre el peor caso observado.
#
#    Alargar el job no cuesta nada en operación normal, porque el disparo
#    siguiente lo cancela igual. Solo importa cuando falla el cron, que es
#    exactamente cuando hace falta.
on:
  schedule:
    # minuto 7 y no en punto: la hora en punto es el pico de carga de GitHub
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nowcast
  # el disparo nuevo releva al viejo; sin esto se acumularían corridas
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pasadas cada 15 minutos durante 4 horas
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOPIC_SALUD: ${{ secrets.NTFY_TOPIC_SALUD }}
        run: |
          git config user.name  "nowcast-bot"
          git config user.email "nowcast-bot@users.noreply.github.com"

          PASADAS=16
          for i in $(seq 1 $PASADAS); do
            echo "::group::pasada $i de $PASADAS — $(date -u '+%H:%M UTC')"
            python -m nowcast.run || echo "la pasada falló, seguimos"

            git add data docs
            if git diff --staged --quiet; then
              echo "sin cambios que guardar"
            else
              git commit -m "nowcast $(date -u '+%Y-%m-%d %H:%M UTC')"
              for intento in 1 2 3; do
                git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
                  && git push origin "HEAD:${GITHUB_REF_NAME}" && break
                sleep 5
              done
            fi
            echo "::endgroup::"

            if [ "$i" -lt "$PASADAS" ]; then sleep 900; fi
          done
