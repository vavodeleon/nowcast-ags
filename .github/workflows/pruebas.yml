name: pruebas

on:
  push:
    paths: ["nowcast/**", "selftest.py", "requirements.txt"]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Autoprueba del motor (sin red)
        run: python selftest.py

      - name: Pruebas de presion, mapa y reproyeccion
        run: python test_visual.py

      - name: Pruebas del reporte matutino
        run: python test_matutino.py

      - name: Pruebas de rayos y temperatura
        run: python test_rayos.py

      - name: Pruebas de falsos positivos y correcciones
        run: python test_ahora.py

      - name: El workflow pasa lo que el codigo espera
        run: python test_workflow.py
