name: reporte-matutino

on:
  schedule:
    # 06:30 hora de Aguascalientes (CST, UTC-6) = 12:30 UTC
    - cron: "30 12 * * *"
  workflow_dispatch:

jobs:
  reporte:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Enviar reporte
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m nowcast.daily
