name: reporte-matutino

# Sin cron a propósito.
#
# El reporte de las 6:30 lo dispara ahora el ciclo del nowcast, que comprueba
# la hora en cada pasada (ver nowcast/daily.py: maybe_send_morning). El cron
# diario de GitHub no disparó ni una sola vez en el primer día del sistema,
# así que depender de él era depender de nada.
#
# Este workflow queda solo para mandarlo a mano cuando quieras.
on:
  workflow_dispatch:

jobs:
  reporte:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Enviar reporte ahora
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOPIC_SALUD: ${{ secrets.NTFY_TOPIC_SALUD }}
        run: python -m nowcast.daily
